# Rockchip RK3588 octa core 8-32GB SoC 4x2.5GBe eMMC USB3 NVMe SATA
BOARD_NAME="EasePi-R2"
BOARD_VENDOR="EasePi"
BOARDFAMILY="rockchip-rk3588"
MAINTAINER="Ifroncy"
MAINTAINERMAIL="j.s.q@qq.com"
VENDORSUPPORT="https://armbian.cn/"
INTRODUCED="2026"
BOOTCONFIG="easepi-r2-rk3588_defconfig"
KERNEL_TARGET="current,edge,vendor"
KERNEL_TEST_TARGET="current,vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588-easepi-r2.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="no"
BOOT_SPI_RKSPI_LOADER="no"
BOOTFS_TYPE=fat
BOOTSIZE=256
IMAGE_PARTITION_TABLE="gpt"
#OVERLAY_DISABLE_AUTOPATCH="yes"
BOOT_SCRIPT="boot-rk35xx.cmd"
BOOT_ENV_FILE="armbianEnv.txt"
# OP-TEE configuration for RK3588 - temporarily disabled
# BL32_BLOB="rk35/rk3588_bl32_v1.20.bin"
# TEE_BLOB="rk35/rk3588_bl32_v1.20.bin"

# Optional IR + Bluetooth support for EasePi-R2.
# Disable temporarily with:
#   EASEPI_R2_PERIPHERALS=no bash build.sh current trixie minimal
if [[ "${EASEPI_R2_PERIPHERALS:-yes}" == "yes" ]]; then
	ENABLE_EXTENSIONS="${ENABLE_EXTENSIONS} easepi-r2-peripherals"
	EASEPI_R2_COMMON_PACKAGES="i2c-tools ir-keytable fonts-dejavu-core rfkill bluetooth bluez bluez-tools iproute2 iputils-ping ethtool bridge-utils dnsmasq nftables iptables ppp pppoe curl ca-certificates wpasupplicant hostapd v4l-utils"
	EASEPI_R2_MAINLINE_GPU_PACKAGES="libdrm2 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers mesa-utils vulkan-tools kmscube glmark2-es2-drm"
	EASEPI_R2_VENDOR_GPU_PACKAGES="libdrm2 libgbm1 ocl-icd-libopencl1 clinfo"
	if [[ "${BRANCH:-current}" == "vendor" ]]; then
		PACKAGE_LIST_EXTRA="${PACKAGE_LIST_EXTRA:-} ${EASEPI_R2_COMMON_PACKAGES} ${EASEPI_R2_VENDOR_GPU_PACKAGES}"
	else
		PACKAGE_LIST_EXTRA="${PACKAGE_LIST_EXTRA:-} ${EASEPI_R2_COMMON_PACKAGES} ${EASEPI_R2_MAINLINE_GPU_PACKAGES}"
	fi
fi

# Bluetooth HCI attach configuration for AP6255 module (ttyS9)
declare -g BLUETOOTH_HCIATTACH_PARAMS="-s 115200 /dev/ttyS9 bcm43xx 1500000"
declare -g BLUETOOTH_HCIATTACH_RKFILL_NUM="all"

function post_family_config__easepi-r2_use_mainline_uboot_except_vendor() {
	if [[ "${EASEPI_R2_KERNEL_PROFILE:-}" == "linux7" ]]; then
		display_alert "$BOARD" "Pinning Linux 7.0 stable kernel profile" "branch:linux-7.0.y" "info"
		declare -g KERNEL_MAJOR_MINOR="7.0"
		declare -g KERNELBRANCH="branch:linux-7.0.y"
		declare -g KERNELPATCHDIR="archive/rockchip64-7.0"
		declare -g LINUXFAMILY="rockchip64"
		declare -g LINUXCONFIG="linux-rockchip64-edge"
	fi

	# use vendor uboot for _vendor_ branch
	if [[ "${BRANCH}" == "vendor" ]]; then
		display_alert "$BOARD" "Vendor U-Boot overrides for $BOARD - $BRANCH" "info"
		# Match the known-good iStoreOS Next vendor baseline as closely as
		# possible: same Radxa U-Boot revision, same generic defconfig, same
		# rkbin DDR/BL31 pair.
		declare -g BOOTCONFIG="rk3588-generic_defconfig"
		declare -g BOOTDELAY=0
		declare -g BOOTSOURCE="https://github.com/radxa/u-boot.git"
		declare -g BOOTBRANCH="commit:6c807ac5008722e240f5282229c15a40aba4918f"
		declare -g BOOTPATCHDIR="legacy/u-boot-radxa-rk35xx"
		# Armbian's current rk3588 default DDR blob moved to v1.20, but the
		# known-good vendor baseline for EasePi-R2 boots with rkbin DDR v1.18.
		# Keep BL31 pinned as well so the whole early boot stack stays aligned.
		declare -g DDR_BLOB="rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.18.bin"
		declare -g BL31_BLOB="rk35/rk3588_bl31_v1.48.elf"
		return 0
	fi

	# use mainline uboot for _current_ and _edge_
	display_alert "$BOARD" "Mainline U-Boot overrides for $BOARD - $BRANCH" "info"
	UBOOT_TARGET_MAP="
	BL31=$RKBIN_DIR/$BL31_BLOB TEE=$RKBIN_DIR/$TEE_BLOB $BOOTCONFIG spl/u-boot-spl.bin u-boot.dtb u-boot.itb;;idbloader.img u-boot.itb"
	declare -g BOOTCONFIG="easepi-r2-rk3588_defconfig"
	declare -g BOOTDELAY=5
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot"
	declare -g BOOTBRANCH="tag:v2025.10"
	declare -g BOOTPATCHDIR="v2025.10"
	declare -g BOOTDIR="u-boot-${BOARD}"
	declare -g BOOT_SCENARIO="binman-atf-mainline"
	declare -g ATF_COMPILE="yes"
	declare -g ATFSOURCE="https://github.com/ARM-software/arm-trusted-firmware"
	declare -g ATFDIR="arm-trusted-firmware"
	declare -g ATFBRANCH="tag:v2.13.0"
	declare -g ATFPATCHDIR="atf-rockchip64/v2.13"
	declare -g ATF_TARGET_MAP="M0_CROSS_COMPILE=arm-linux-gnueabi- PLAT=rk3588 bl31;;build/rk3588/release/bl31/bl31.elf:bl31.elf"
	# HDMI-IN on mainline kernels needs the open-source TF-A BL31 interrupt
	# handling; Rockchip rkbin BL31 makes snps_hdmirx fail probing.
	declare -g UBOOT_TARGET_MAP="BL31=bl31.elf ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd # disable stuff from rockchip64_common; we're using binman here which does all the work already

	# Just use the binman-provided u-boot-rockchip.bin, which is ready-to-go
	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}
