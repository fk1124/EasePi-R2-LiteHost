# EasePi-R2 default LAN DHCP/DNS. Managed by /root/0.sh or /usr/local/sbin/0.
interface=lo
interface=br-lan
no-dhcp-interface=lo
bind-dynamic
listen-address=127.0.0.1,10.10.0.1
port=53
server=223.5.5.5
server=119.29.29.29
domain-needed
bogus-priv
no-resolv
expand-hosts
domain=lan
dhcp-authoritative
dhcp-range=interface:br-lan,10.10.0.100,10.10.0.200,255.255.255.0,12h
dhcp-option=interface:br-lan,3,10.10.0.1
dhcp-option=interface:br-lan,6,10.10.0.1
